
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manager Tool - Team V1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --glass-bg: rgba(255, 255, 255, 0.75);
        --glass-border: rgba(255, 255, 255, 0.6);
        --primary-indigo: #4f46e5;
        --primary-indigo-glow: rgba(99, 102, 241, 0.15);
        --primary-crimson: #ef4444;
        --primary-gold: #f59e0b;
        --accent-emerald: #10b981;
        --accent-violet: #8b5cf6;
      }
      
      body { 
        font-family: 'Plus Jakarta Sans', sans-serif; 
        transition: background-color 0.8s ease-in-out, background 0.8s ease-in-out; 
        overflow-x: hidden;
        color: #0f172a;
        perspective: 2000px;
        min-height: 100vh;
      }

      /* Body Themes */
      body.festive-default {
        background: radial-gradient(at 0% 0%, rgba(243, 244, 246, 0.4) 0px, transparent 50%), 
                    radial-gradient(at 50% 0%, rgba(239, 246, 255, 0.4) 0px, transparent 50%), 
                    radial-gradient(at 100% 0%, rgba(245, 243, 255, 0.4) 0px, transparent 50%), 
                    #f8fafc;
      }
      body.festive-tet {
        background: radial-gradient(at 0% 0%, rgba(254, 242, 242, 0.5) 0px, transparent 50%), 
                    radial-gradient(at 50% 0%, rgba(254, 243, 199, 0.5) 0px, transparent 50%), 
                    radial-gradient(at 100% 0%, rgba(254, 242, 242, 0.5) 0px, transparent 50%), 
                    #fefcfc;
      }
      body.festive-christmas {
        background: radial-gradient(at 0% 0%, rgba(239, 246, 255, 0.5) 0px, transparent 50%), 
                    radial-gradient(at 50% 0%, rgba(240, 253, 250, 0.5) 0px, transparent 50%), 
                    radial-gradient(at 100% 0%, rgba(239, 246, 255, 0.5) 0px, transparent 50%), 
                    #fcfdfd;
      }

      /* Responsive utility */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--glass-border);
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.03), 0 0 0 1px rgba(99, 102, 241, 0.02);
      }
      .glass-card-hover {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .glass-card-hover:hover {
        transform: translateY(-4px);
        box-shadow: 0 30px 60px -15px rgba(99, 102, 241, 0.08), 0 0 0 1px rgba(99, 102, 241, 0.05);
        border-color: rgba(99, 102, 241, 0.25);
      }

      /* Highlights and Accents */
      .text-gradient-primary {
        background: linear-gradient(135deg, #4f46e5 0%, #8b5cf6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .glowing-dot-active {
        position: relative;
        display: inline-flex;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #10b981;
      }
      .glowing-dot-active::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background-color: #10b981;
        animation: pulse-glow 2s infinite;
      }
      @keyframes pulse-glow {
        0% { transform: scale(1); opacity: 0.8; }
        100% { transform: scale(3); opacity: 0; }
      }

      @keyframes shimmer {
        0% { transform: skewX(-45deg) translateX(-150%); }
        100% { transform: skewX(-45deg) translateX(250%); }
      }
      .animate-shimmer {
        animation: shimmer 2s infinite;
      }

      @keyframes pageSlide {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .page-transition { animation: pageSlide 0.4s ease-out forwards; }

      @keyframes zoomIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-zoom-in { animation: zoomIn 0.5s cubic-bezier(0.16, 1, 0.3, 1); }

      @keyframes fall { 
        0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; } 
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { transform: translateY(105vh) rotate(360deg); opacity: 0; } 
      }
      
      .snowflake { color: #fff; position: absolute; top: -10%; animation: fall linear infinite; text-shadow: 0 0 8px rgba(255,255,255,0.6); pointer-events: none; z-index: 100; }
      .petal { position: absolute; top: -10%; border-radius: 150% 0 150% 0; background: linear-gradient(135deg, #ffb7c5, #ff6b81); animation: fall linear infinite; pointer-events: none; z-index: 100; }
      .sparkle-gold { position: absolute; top: -10%; background: radial-gradient(circle, #fff9c4, #fbc02d); border-radius: 50%; animation: fall linear infinite; pointer-events: none; z-index: 99; }

      /* Hover flip animation */
      .hover-lift { 
        transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.8s ease;
        transform-style: preserve-3d;
      }
      .hover-lift:hover { 
        transform: translateY(-8px) rotateY(4deg) rotateX(1deg); 
        box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.15); 
      }
      
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }
      .animate-shake { animation: shake 0.4s ease-in-out; }

      /* Custom Input Styling */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus {
        -webkit-box-shadow: 0 0 0px 1000px transparent inset;
        transition: background-color 5000s ease-in-out 0s;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",

        "react/": "https://esm.sh/react@^19.2.3/",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.89.0",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0",

        "recharts": "https://esm.sh/recharts@^2.15.0",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
        "xlsx": "https://esm.sh/xlsx@^0.18.5",
        "vite": "https://esm.sh/vite@^7.3.0",
        "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
      }
    }
    </script>
  </head>

    <div id="root"></div>

  </body>
</html>
